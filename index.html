<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>업무일지</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5B5CEB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무일지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5FA;--surface:#FFFFFF;--sunk:#F0F1F7;--ink:#1B1D2A;--ink2:#5D6275;--ink3:#9297A8;--line:#E6E8F0;--line2:#D3D6E3;
--acc:#5B5CEB;--accs:#EEEEFF;--acct:#3E3FC4;--ok:#2E9E6A;--oks:#E4F6EC;--ng:#D0473A;--ngs:#FCEBEA;--warn:#C07A12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.k0{--c:#EFEEFE;--t:#3C3489;--m:#8F86E8}.k1{--c:#E3F6EF;--t:#085041;--m:#2FAE85}.k2{--c:#FCEDF3;--t:#72243E;--m:#DE6C95}.k3{--c:#FDEFE9;--t:#712B13;--m:#E4774B}
.k4{--c:#E8F2FC;--t:#0C447C;--m:#4B97E6}.k5{--c:#EDF5E2;--t:#27500A;--m:#76AD34}.k6{--c:#FCF1DE;--t:#633806;--m:#D69A2E}.k7{--c:#EEEDE8;--t:#444441;--m:#8E8C84}.kr{--c:#FCEBEB;--t:#791F1F;--m:#D0473A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10121C;--surface:#191C2A;--sunk:#141724;--ink:#E7E9F3;--ink2:#A3A8BC;--ink3:#6F7489;--line:#282C40;--line2:#363B54;--acc:#8B8CF8;--accs:#25274A;--acct:#C9CAFF;--ok:#63C993;--oks:#16301F;--ng:#F09A8A;--ngs:#3A1A18;--warn:#E6B45A}
:root:not([data-theme="light"]) .k0{--c:#26215C;--t:#CECBF6}:root:not([data-theme="light"]) .k1{--c:#04342C;--t:#9FE1CB}:root:not([data-theme="light"]) .k2{--c:#4B1528;--t:#F4C0D1}:root:not([data-theme="light"]) .k3{--c:#4A1B0C;--t:#F5C4B3}:root:not([data-theme="light"]) .k4{--c:#042C53;--t:#B5D4F4}:root:not([data-theme="light"]) .k5{--c:#173404;--t:#C0DD97}:root:not([data-theme="light"]) .k6{--c:#412402;--t:#FAC775}:root:not([data-theme="light"]) .k7{--c:#2C2C2A;--t:#D3D1C7}:root:not([data-theme="light"]) .kr{--c:#501313;--t:#F7C1C1}}
:root[data-theme="dark"]{--bg:#10121C;--surface:#191C2A;--sunk:#141724;--ink:#E7E9F3;--ink2:#A3A8BC;--ink3:#6F7489;--line:#282C40;--line2:#363B54;--acc:#8B8CF8;--accs:#25274A;--acct:#C9CAFF;--ok:#63C993;--oks:#16301F;--ng:#F09A8A;--ngs:#3A1A18;--warn:#E6B45A}
:root[data-theme="dark"] .k0{--c:#26215C;--t:#CECBF6}:root[data-theme="dark"] .k1{--c:#04342C;--t:#9FE1CB}:root[data-theme="dark"] .k2{--c:#4B1528;--t:#F4C0D1}:root[data-theme="dark"] .k3{--c:#4A1B0C;--t:#F5C4B3}:root[data-theme="dark"] .k4{--c:#042C53;--t:#B5D4F4}:root[data-theme="dark"] .k5{--c:#173404;--t:#C0DD97}:root[data-theme="dark"] .k6{--c:#412402;--t:#FAC775}:root[data-theme="dark"] .k7{--c:#2C2C2A;--t:#D3D1C7}:root[data-theme="dark"] .kr{--c:#501313;--t:#F7C1C1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:7px 12px;cursor:pointer}
button:active{transform:scale(.98)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accs);border-color:var(--acc)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 110px}
.page{max-width:680px;margin:0 auto}
/* nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bn a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);cursor:pointer;padding:4px 0;border-radius:10px;user-select:none}
nav.bn a.on{color:var(--acc);font-weight:600}
nav.bn a svg.i{width:21px;height:21px}
@media (min-width:900px){
 nav.bn{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:none;border-bottom:1px solid var(--line);justify-content:center;gap:6px;padding:8px}
 nav.bn a{flex:none;flex-direction:row;gap:6px;font-size:14px;padding:8px 16px}
 nav.bn a.on{background:var(--accs)}
 .wrap{padding-bottom:60px}
}
/* header */
.phd{display:flex;align-items:center;gap:10px;padding:18px 0 12px}
.phd h1{font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.02em}
.phd .back{border:none;background:none;padding:4px;color:var(--ink)}
.hello .dt{font-size:14px;font-weight:600;color:var(--ink)}
.hello h1{font-size:21px;font-weight:700;line-height:1.45;word-break:keep-all;margin:6px 0 0;letter-spacing:-.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ct h2{font-size:16px;font-weight:700;margin:0}
.more{font-size:12px;color:var(--ink3);cursor:pointer;display:flex;align-items:center;gap:2px;background:none;border:none;padding:2px}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sgrid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.sc .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.sc .l{font-size:12px;color:var(--ink2)}
.sc .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic.a{background:var(--accs);color:var(--acc)}.ic.g{background:var(--oks);color:var(--ok)}.ic.b{background:#E8F2FC;color:#378ADD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic.b{background:#042C53;color:#85B7EB}}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{padding:8px 0 6px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd .w{font-size:12px;color:var(--ink3)}.wd .n{font-size:14px;font-weight:600}
.wd.on{background:var(--acc);color:#fff}.wd.on .w{color:#E4E4FF}
.wd.today:not(.on) .n{color:var(--acc)}
.wd .ds{display:flex;gap:3px;height:6px;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--m)}
.wd.on .dot{background:#fff}
.pc{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;margin-bottom:10px;cursor:pointer;background:var(--c);border:1px solid transparent}
.pc:hover{border-color:var(--m)}
.fi{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface)}
.fi svg{width:24px;height:24px;fill:var(--m);stroke:none}
.pc .nm{font-weight:700;font-size:15px;color:var(--ink)}
.pc .sub{font-size:12px;color:var(--ink2)}
.pb{height:6px;border-radius:3px;background:rgba(127,127,160,.18);margin:6px 0 4px;overflow:hidden}
.pb i{display:block;height:6px;border-radius:3px;background:var(--m)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:7px;background:var(--c);color:var(--t);white-space:nowrap;font-weight:500}
.pill.o{background:var(--sunk);color:var(--ink2)}
.rl{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rl:last-child{border-bottom:none}
.rl .bl{width:9px;height:9px;border-radius:50%;background:var(--m);margin-top:6px;flex:none}
.rl .tt{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl .mt{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink3)}
.todo{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--c);color:var(--t)}
.num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;background:var(--t);color:var(--c);cursor:pointer}
.chk{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:var(--t);color:var(--c)}
.chk svg.i{width:14px;height:14px;stroke-width:3}
.ell{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ell.open{white-space:pre-wrap}
.ib{cursor:pointer;opacity:.6;padding:2px;background:none;border:none;color:inherit;display:flex}
.ib svg.i{width:16px;height:16px}
.alert{display:flex;gap:8px;align-items:center;border-radius:14px;padding:10px 12px;margin-bottom:14px;cursor:pointer;font-size:13px;background:var(--ngs);color:var(--ng)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink2);user-select:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.fab{position:fixed;right:max(18px,calc(50vw - 540px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--acc);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 8px 22px rgba(91,92,235,.35)}
@media (min-width:900px){.fab{bottom:28px}}
.btnp{background:var(--acc);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center;width:100%}
.btns{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:7px 16px;font-weight:600}
.fl{font-size:13px;font-weight:600;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.cnt{font-size:11px;color:var(--ink3);text-align:right;margin-top:4px}
.selbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface)}
.selbox select,.selbox input{border:none;padding:11px 0;outline:none;background:transparent}
.tag{display:inline-flex;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--c);color:var(--t)}
.hint{display:flex;gap:10px;align-items:center;background:var(--accs);color:var(--acct);border-radius:14px;padding:12px;font-size:12px;margin-top:12px}
.err{font-size:12px;color:var(--ng);min-height:0}
/* timeline */
.tl{position:relative;padding-left:62px}
.tl::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ti{position:relative;margin-bottom:10px}
.ti .tm{position:absolute;left:-62px;top:12px;width:44px;text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ti .nd{position:absolute;left:-14px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--m);border:2px solid var(--surface)}
.tc{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--m);border-radius:14px;padding:10px 12px;cursor:pointer}
.tc .tt{font-size:14px;font-weight:500;margin:4px 0}
.tc .ft{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink3)}
.tc.done .tt{color:var(--ink)}
.tc.todo{border-style:dashed;border-left-style:solid}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin-bottom:12px}
.seg div{flex:1;text-align:center;font-size:13px;padding:7px;border-radius:9px;cursor:pointer;color:var(--ink2)}
.seg .on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:var(--c);color:var(--t)}
.row.x{align-items:flex-start}
.st{font-size:11px;padding:2px 8px;border-radius:7px;flex:none;border:1px solid var(--t);white-space:nowrap}
.sm{font-size:11px;opacity:.8;flex:none;white-space:nowrap}
.muted{font-size:13px;color:var(--ink3)}
.ed{border:1.5px solid var(--m);background:var(--surface);border-radius:14px;padding:12px;margin-bottom:8px}
.fr{display:flex;gap:6px;margin-top:6px;align-items:center}
.lb{font-size:12px;flex:none;width:58px;color:var(--ink2)}
.mg{border-bottom:1px solid var(--line);padding:6px 2px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.mg b{font-size:13px}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cd{min-height:52px;border-radius:10px;padding:3px 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.cd.sel{background:var(--accs)}
.dn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.dn.today{background:var(--acc);color:#fff}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:38px}
.sq{width:6px;height:6px;border-radius:1px;background:var(--m)}
.offl{font-size:9px;color:var(--ng);line-height:1}
.hbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.hbar .nm{width:80px;flex:none;text-align:center;padding:2px 0;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;background:var(--c);color:var(--t)}
.hbar .tr{flex:1;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:10px;background:var(--m);border-radius:5px}
.hbar .n{width:30px;text-align:right;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:5px;height:120px;margin:6px 0 2px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--ink2)}
.vbars i{display:block;width:100%;background:var(--acc);opacity:.75;border-radius:5px 5px 0 0}
.sum{border-radius:14px;padding:12px 14px;margin-bottom:8px;background:var(--c);color:var(--t)}
.sum .sh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;cursor:pointer}
.sum .sb{white-space:pre-wrap;font-size:13px;margin-top:6px;line-height:1.65}
.sum textarea{min-height:170px;margin-top:6px;font-size:13px;color:var(--ink)}
.banner{font-size:12px;padding:6px 16px;background:var(--sunk);color:var(--ink2);text-align:center}
.sw{width:30px;height:30px;border-radius:50%;cursor:pointer;background:var(--m);border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--ink2);margin:10px 0;justify-content:center;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.center{text-align:center;padding:60px 16px}
.hgrid{display:block}
.syncp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:25;display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--c);color:var(--t);cursor:pointer;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.syncp .sd{width:7px;height:7px;border-radius:50%;background:var(--m)}
@media (min-width:900px){.syncp{top:calc(env(safe-area-inset-top,0px) + 14px)}}
.seg4{display:flex;gap:8px;overflow-x:auto}.seg4 .fchip{flex:1;text-align:center;white-space:nowrap}
.plist{display:flex;flex-direction:column;gap:10px}
.pli{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.pli:hover{border-color:var(--m);box-shadow:0 2px 10px rgba(91,92,235,.08)}
.pli .pn2{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pli .pv{font-size:12px;font-weight:600;color:var(--t)}
.ptabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:6}
@media (min-width:900px){.ptabs{top:calc(env(safe-area-inset-top,0px) + 60px)}}
.ptabs span{flex:1;display:flex;gap:5px;align-items:center;justify-content:center;font-size:13px;padding:8px 2px;border-radius:10px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.ptabs span svg.i{width:15px;height:15px}
.ptabs span.on{background:var(--acc);color:#fff;font-weight:600}
.sgrid.s4{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}.sgrid.s4 .sc{padding:12px 6px}.sgrid.s4 .v{font-size:19px}.sgrid.s4 .l{font-size:11px}
.ic.r{background:var(--ngs);color:var(--ng)}
.wtl{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.wtl:last-child{border-bottom:none}
.wd2{font-size:12px;color:var(--acc);width:62px;flex:none;padding-left:14px;position:relative}
.wd2::before{content:"";position:absolute;left:0;top:5px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.wti{font-size:13px;padding:1px 0 1px 12px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wti::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.wti.todo{color:var(--ink2)}
.ach{display:flex;gap:12px;align-items:center;padding:8px 0;font-size:13px}.ach .ic{display:flex;align-items:center;justify-content:center;flex:none}
.issc{background:var(--ngs);border-color:transparent}
.iss{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.iss:last-child{border-bottom:none}
.iss .idot{width:8px;height:8px;border-radius:50%;background:var(--ng);margin-top:7px;flex:none;box-shadow:0 0 0 3px var(--ngs)}
.iss .it{font-size:13px;font-weight:600}.iss.done{opacity:.55}.iss.done .idot{background:var(--ok)}.iss.cand .it{font-weight:400}
.mini{font-size:11px;padding:3px 9px;border-radius:8px;flex:none}
.tbl .th,.tbl .tr2{display:grid;grid-template-columns:48px minmax(0,1fr) 62px;gap:8px;align-items:center;padding:9px 8px;font-size:13px}
.tbl .th{background:var(--sunk);border-radius:10px;font-size:11px;color:var(--ink2)}.tbl .th span:last-child{text-align:center}
.tbl .tr2{border-bottom:1px solid var(--line);cursor:pointer}.tbl .tr2:hover{background:var(--sunk)}
.tt2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri2{display:grid;grid-template-columns:72px minmax(0,1fr) 18px;gap:8px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink3)}.ri2 .tt2{color:var(--ink)}
.fic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--c);color:var(--m);flex:none}
.memo{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:13px}

function lotSave(){lotSyncF();const f=LF;if(!f.part){$('le').textContent='부품을 선택하세요';return}
  if(lotOpenSpec&&f.dims.some(d=>!d.name)){$('le').textContent='치수 항목 이름이 비어 있습니다';return}
  const p=jn(f.j),code=lotCode(p);if(!p.lotCode)p.lotCode=code;
  const keep=f._orig&&f._orig.startsWith(lotNoOf(code,f.date,f.stage,0).slice(0,-2));const no=keep?f._orig:lotNoOf(code,f.date,f.stage,nextSeq(code,f.date,f.stage,f._orig));
  const spec=f.dims.map(d=>({name:d.name,nominal:d.nominal,plus:d.plus,minus:d.minus})),old=(p.lotSpec||{})[f.part];
  if(JSON.stringify(old||[])!==JSON.stringify(spec)){p.lotSpec={...(p.lotSpec||{}),[f.part]:spec}}
  const {_new,_orig,...rec}=f;Object.assign(rec,{lotNo:no,code,customer:rec.customer||p.cust||''});
  ['shots','good','ng'].forEach(k=>{if(rec[k]==='')delete rec[k]});
  S.lots=(S.lots||[]).filter(l=>l.lotNo!==f._orig&&l.lotNo!==no);S.lots.push(rec);dirtyM();
  const bt=backTo;LF=null;view=bt;if(bt==='log')day=rec.date;render();window.scrollTo(0,0);saveNow('LOT '+no+' 저장됨')}
function lotDel(){const b=$('ldel');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='한 번 더 누르면 삭제';return}
  S.lots=(S.lots||[]).filter(l=>l.lotNo!==LF._orig);dirtyM();LF=null;view=backTo;render()}

/* LOT 카드 (일지 타임라인 · 프로젝트 사출 이력 공용) */
function lotCard(l,showProj){const D=dimsJ(l),ng=D.filter(d=>!d.ok);
  return `<div class="lotc k${jn(l.j).k}${ng.length?' ng':''}" onclick="openLot('${esc(l.lotNo)}')">
<div class="lch"><span class="lstg">${esc(l.stage||'-')}</span><b class="mono">${esc(l.lotNo)}</b><span class="pill ${LOT_STK[l.status]||'k7'}">${esc(l.status||'-')}</span>${showProj?`<span class="pill">${esc(jn(l.j).n)}</span>`:''}<span class="lpart">${esc(l.part||'')}</span>
<span class="lqty">${l.shots!=null?`샷 ${l.shots}`:''}${l.good!=null?` · 양품 ${l.good}`:''}${l.ng!=null?` · 불량 ${l.ng}`:''}</span></div>
${D.length?`<div class="ldc">${D.map(d=>`<span class="${d.ok?'ok':'ng'}">${esc(d.name)} <b>${d.v}</b><i>${isPV(d.name)?'':sgn(d.dev)}</i></span>`).join('')}</div>`:''}
${(l.cond||[]).length?`<div class="lcl">${(l.cond||[]).map(c=>`${esc(c.l)} <b>${esc(c.v)}</b>${esc(c.u||'')}`).join(' · ')}</div>`:''}
${(l.defects||[]).length?`<div class="ldf">${l.defects.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
${l.memo?`<div class="lmm">${esc(l.memo)}</div>`:''}
${(l.photos||[]).length?`<div class="lphs sm">${l.photos.slice(0,6).map((id,i)=>phTile(id,i)).join('')}${l.photos.length>6?`<span class="muted" style="font-size:11px;align-self:center">+${l.photos.length-6}</span>`:''}</div>`:''}</div>`}

/* 프로젝트 상세 > 사출 이력 탭 */
function pdLot(p){const all=lotsOf(p.id).sort(lotSort),parts=[...new Set(all.map(l=>l.part).filter(Boolean))].sort();if(lotPart!=='전체'&&!parts.includes(lotPart))lotPart='전체';
  const L=all.filter(l=>lotPart==='전체'||l.part===lotPart),ngN=L.filter(lotNG).length,stages=[...new Set(L.map(l=>l.stage))].filter(Boolean).sort();
  let body='',y='',d='';L.forEach(l=>{const yy=(l.date||'').slice(0,4);if(yy!==y){y=yy;d='';body+=`<div class="yrs">${yy}년</div>`}if(l.date!==d){d=l.date;body+=`<div class="dts"><span>${md(l.date)}</span><i>${L.filter(x=>x.date===d).length}건</i></div>`}body+=`<div class="dtl">${lotCard(l)}</div>`});
  return `<div class="sgrid s4">${[['사출 LOT',L.length+'건','b','cube'],['차수',stages.join(' · ')||'-','a','chart'],['치수 NG 포함',ngN+'건','r','bell'],['사진',L.reduce((s,l)=>s+(l.photos||[]).length,0)+'장','g','cam']].map(([l,v,c,i])=>`<div class="sc" style="text-align:center"><div class="ic ${c}" style="margin:0 auto 6px">${ic(i)}</div><div class="l">${l}</div><div class="v" style="font-size:18px">${v}</div></div>`).join('')}</div>
<div class="card"><div class="ct"><h2>${ic('cube')} 사출 이력</h2><span style="display:flex;gap:6px">${all.length?`<button onclick="openLotSum('${p.id}')">${ic('log')} SUMMARY</button>`:''}<button class="btns" onclick="openLot(null,{j:'${p.id}',part:lotPart!=='전체'?lotPart:''})">＋ LOT 기록</button></span></div>
${parts.length>1?`<div class="chips" style="margin-bottom:10px">${['전체',...parts].map(x=>`<span class="chip${lotPart===x?' on':''}" onclick="lotPart='${esc(x)}';render()">${esc(x)}</span>`).join('')}</div>`:''}
${lotPart!=='전체'&&L.length>1?lotTrendCard(L):''}
${body||'<div class="muted">사출 기록이 없습니다. ＋ LOT 기록으로 추가하세요.</div>'}</div>`}
/* 부품별 치수 추이 (LOT 앱 '정리' 화면) */
function lotTrendCard(L){const asc=L.slice().sort((a,b)=>-lotSort(a,b)).filter(l=>dimsJ(l).length);if(asc.length<2)return '';const names=[...new Set(asc.flatMap(l=>dimsJ(l).map(d=>d.name)))];
  const cols=asc.slice(-8);return `<div class="ltr"><div class="fl" style="margin-top:0">치수 추이 <span class="muted" style="font-weight:400;font-size:11px">최근 ${cols.length}개 LOT · 빨강 = NG</span></div><div class="ltw"><table><thead><tr><th>항목</th>${cols.map(l=>`<th>${esc(l.stage)}<br><small>${l.date.slice(5).replace('-','/')}</small></th>`).join('')}</tr></thead><tbody>${names.map(n=>`<tr><td>${esc(n)}</td>${cols.map(l=>{const d=dimsJ(l).find(x=>x.name===n);return d?`<td class="${d.ok?'':'ng'}">${d.v}</td>`:'<td class="muted">·</td>'}).join('')}</tr>`).join('')}</tbody></table></div></div>`}

/* ---------- 사출 이력 SUMMARY (보고용 1장) ---------- */
let LS=null;
const LS_MAXPH=8;
function openLotSum(j){const p=jn(j),all=lotsOf(j),parts=[...new Set(all.map(l=>l.part).filter(Boolean))].sort(),sv=p.lotSum||{};
  const stages=[...new Set(all.map(l=>l.stage).filter(Boolean))].sort();
  const partsSel=(sv.parts||[]).filter(x=>parts.includes(x));
  LS={j,parts:partsSel.length?partsSel:(lotPart!=='전체'&&parts.includes(lotPart)?[lotPart]:parts.slice(0,1)),stages:(sv.stages||[]).filter(x=>stages.includes(x)),
    off:new Set(sv.off||all.filter(l=>l.status==='폐기').map(l=>l.lotNo)),ph:(sv.ph||[]).slice(),title:sv.title||'',note:sv.note||'',plan:sv.plan||'',showMemo:sv.showMemo!==false,showMold:sv.showMold!==false};
  if(!LS.stages.length)LS.stages=stages;backTo='pd';view='lsum';render();window.scrollTo(0,0)}
function lsSave(){const p=jn(LS.j);p.lotSum={parts:LS.parts,stages:LS.stages,off:[...LS.off],ph:LS.ph,title:LS.title,note:LS.note,plan:LS.plan,showMemo:LS.showMemo,showMold:LS.showMold};dirtyM()}
function lsTg(k,v){const a=LS[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);lsSave();render()}
function lsLot(no){LS.off.has(no)?LS.off.delete(no):LS.off.add(no);lsSave();render()}
function lsPh(id){const i=LS.ph.indexOf(id);if(i>=0)LS.ph.splice(i,1);else{if(LS.ph.length>=LS_MAXPH){toast(`사진은 ${LS_MAXPH}장까지 넣을 수 있습니다`);return}LS.ph.push(id)}lsSave();render()}
function lsTxt(k,el){LS[k]=el.value;const t=$('ls_'+k);if(t)t.textContent=el.value||(k==='title'?lsDefTitle():'');lsSave();lsFit()}
const lsDefTitle=()=>`${jn(LS.j).n} · 사출 이력 SUMMARY`;
function lsMolds(){return moldsOf(LS.j).filter(m=>LS.stages.includes(m.stage)&&(!(m.parts||[]).length||m.parts.some(x=>LS.parts.includes(x)))).sort((a,b)=>stOrd(a.stage)-stOrd(b.stage)||a.date.localeCompare(b.date))}
function lsPhotos(sel){const out=[];sel.forEach(l=>(l.photos||[]).forEach(id=>out.push({id,cap:`${l.part} ${l.stage} · ${l.date.slice(5).replace('-','/')} · ${l.lotNo.split('-').pop()}`,tag:`${l.stage} ${l.date.slice(5).replace('-','/')}`})));
  if(LS.showMold)lsMolds().forEach(m=>(m.items||[]).forEach((it,i)=>it.photos.forEach(id=>out.push({id,cap:`금형 ${m.stage} 수정 · ${m.date.slice(5).replace('-','/')} · ${i+1}. ${it.prob.slice(0,18)}`,tag:`금형 ${m.stage}`,mold:1}))));return out}
function lsLots(){return lotsOf(LS.j).filter(l=>LS.parts.includes(l.part)&&LS.stages.includes(l.stage)).sort((a,b)=>-lotSort(a,b))}
function lsView(){const p=jn(LS.j),all=lotsOf(LS.j),parts=[...new Set(all.map(l=>l.part).filter(Boolean))].sort(),stages=[...new Set(all.map(l=>l.stage).filter(Boolean))].sort(),cand=lsLots(),sel=cand.filter(l=>!LS.off.has(l.lotNo));
  const phs=lsPhotos(sel);LS.ph=LS.ph.filter(id=>phs.some(x=>x.id===id));
  return hdr('사출 이력 SUMMARY',`LS=null;go('pd','${LS.j}')`,`<button class="btns" onclick="lsPrint()">${ic('log')} 인쇄 · PDF</button>`)+`<div class="lsctl">
<div class="card"><div class="fl" style="margin-top:0">부품</div><div class="chips">${parts.map(x=>`<span class="chip${LS.parts.includes(x)?' on':''}" onclick="lsTg('parts','${esc(x)}')">${esc(x)}</span>`).join('')}</div>
<div class="fl">차수</div><div class="chips">${stages.map(x=>`<span class="chip${LS.stages.includes(x)?' on':''}" onclick="lsTg('stages','${x}')">${x}</span>`).join('')}</div>
<div class="fl">포함할 LOT <span class="muted" style="font-weight:400;font-size:11px">${sel.length} / ${cand.length} · 눌러서 빼기/넣기</span></div>
<div class="lslots">${cand.map(l=>`<span class="lsl${LS.off.has(l.lotNo)?' off':''}" onclick="lsLot('${esc(l.lotNo)}')"><b>${esc(l.stage)}</b> ${esc(l.part)} ${l.date.slice(5).replace('-','/')}<small>${esc(l.lotNo.split('-').pop())} · ${esc(l.status||'')}</small></span>`).join('')||'<span class="muted">선택한 부품·차수에 LOT 가 없습니다.</span>'}</div>
${sel.length>12?`<div class="err" style="margin-top:6px">LOT 가 ${sel.length}개라 표가 작아집니다. 12개 이하를 권장합니다.</div>`:''}
<div class="fl">대표 사진 <span class="muted" style="font-weight:400;font-size:11px">${LS.ph.length} / ${LS_MAXPH} · 누른 순서대로 배치</span></div>
<div class="lphs sm">${phs.map(({id,tag,mold})=>{const n=LS.ph.indexOf(id);return `<span class="lph lspk${n>=0?' pk':''}${mold?' mdph':''}" data-fid="${esc(id)}" onclick="lsPh('${esc(id)}')"><span class="lphn">${ic('cam')}</span>${n>=0?`<em>${n+1}</em>`:''}<i>${esc(tag)}</i></span>`}).join('')||'<span class="muted" style="font-size:12px">선택한 LOT 에 사진이 없습니다.</span>'}</div>
<div class="fl">제목</div><input value="${esc(LS.title)}" placeholder="${esc(lsDefTitle())}" oninput="lsTxt('title',this)">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div class="fl">종합 의견</div><textarea rows="4" placeholder="예: T1 대비 T2 중심두께 +0.2mm 개선, PV 여전히 NG" oninput="lsTxt('note',this)">${esc(LS.note)}</textarea></div>
<div><div class="fl">향후 계획</div><textarea rows="4" placeholder="예: 코어 2차 보정 후 T3 조건별 사출 (10/22)" oninput="lsTxt('plan',this)">${esc(LS.plan)}</textarea></div></div>
<div class="chips" style="margin-top:10px"><span class="chip${LS.showMemo?' on':''}" onclick="LS.showMemo=!LS.showMemo;lsSave();render()">LOT 메모 포함</span><span class="chip${LS.showMold?' on':''}" onclick="LS.showMold=!LS.showMold;lsSave();render()">금형 수정 내역 포함 (${lsMolds().length}회)</span></div>

<div class="lswrap"><div id="lsheet">${lsSheet(p,sel)}</div></div>`}

function lsSheet(p,sel){const ds=sel.map(l=>l.date).sort(),tot=k=>sel.reduce((s,l)=>s+(+l[k]||0),0),sh=tot('shots'),gd=tot('good'),ng=tot('ng'),yl=gd+ng?Math.round(gd/(gd+ng)*1000)/10:null;

  const blocks=LS.parts.map(pt=>{const L=sel.filter(l=>l.part===pt);return L.length?lsTable(p,pt,L):''}).join('');
  const PA=lsPhotos(sel),phs=LS.ph.map(id=>PA.find(x=>x.id===id)).filter(Boolean),MDL=LS.showMold?lsMolds():[];
  return `<div class="ls-h"><div><div class="ls-t" id="ls_title">${esc(LS.title||lsDefTitle())}</div>
<div class="ls-s">고객사 ${esc(p.cust||'-')} · 부품 ${LS.parts.map(esc).join(', ')}${p.mes?` · 작번 ${esc(p.mes)}`:''} · 차수 ${[...new Set(sel.map(l=>l.stage))].sort().join(' → ')||'-'}</div></div>
<div class="ls-d">작성일 ${TD().replace(/-/g,'.')}</div></div>
<div class="ls-k">${kpi.map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join('')}${Object.keys(defC).length?`<div class="wide"><span>불량 유형</span><b>${Object.entries(defC).sort((a,b)=>b[1]-a[1]).map(([d])=>esc(d)).join(' · ')}</b></div>`:''}</div>
${blocks||'<div class="ls-empty">포함된 LOT 가 없습니다.</div>'}

/* 부품별 표: 열 = LOT (시간순), 행 = 상태·수량 / 사출 조건 / 치수 / 불량 / 메모 */
function lsTable(p,pt,L){const spec=(p.lotSpec||{})[pt]||[],names=[...spec.map(d=>d.name)];L.forEach(l=>dimsJ(l).forEach(d=>{if(!names.includes(d.name))names.push(d.name)}));
  const used=names.filter(n=>L.some(l=>dimsJ(l).some(d=>d.name===n)));
  const conds=COND9.map(c=>c[1]).filter(n=>L.some(l=>(l.cond||[]).some(c=>c.l===n&&c.v!=='')));
  const cv=(l,n)=>{const c=(l.cond||[]).find(c=>c.l===n);return c?c.v:''};
  const unit=n=>(COND9.find(c=>c[1]===n)||[])[2]||'';
  const sp=n=>{const s=spec.find(d=>d.name===n)||L.map(l=>(l.dims||[]).find(d=>d.name===n)).find(Boolean);if(!s)return '';return isPV(n)?`≤ ${s.nominal}`:`${s.nominal} <small>+${s.plus}/-${Math.abs(s.minus||0)}</small>`};
  const head=`<tr class="lh"><th>${esc(pt)}</th><th>스펙</th>${L.map(l=>`<th><b>${esc(l.stage)}</b> ${l.date.slice(5).replace('-','/')}<small>${esc(l.lotNo.split('-').pop())}</small></th>`).join('')}</tr>`;
  const r=(lab,cells,cls)=>`<tr class="${cls||''}"><td>${lab}</td>${cells}</tr>`;
  let rows='';
  if(conds.length){rows+=`<tr class="lgrp"><td colspan="${L.length+2}">사출 조건 <small>굵게 = 직전 LOT 대비 변경</small></td></tr>`;
    conds.forEach(n=>{let prev=null;rows+=r(`${n}`,`<td class="u">${unit(n)}</td>`+L.map(l=>{const v=cv(l,n),ch=prev!==null&&v!==''&&String(v)!==String(prev);if(v!=='')prev=v;return `<td class="${ch?'chg':''}">${v!==''?esc(v):'·'}</td>`}).join(''))})}
  if(used.length){rows+=`<tr class="lgrp"><td colspan="${L.length+2}">치수 측정 <small>빨강 = 스펙 벗어남</small></td></tr>`;
    used.forEach(n=>{rows+=r(esc(n),`<td class="u">${sp(n)}</td>`+L.map(l=>{const d=dimsJ(l).find(x=>x.name===n);return d?`<td class="${d.ok?'ok':'ng'}">${d.v}</td>`:'<td class="na">·</td>'}).join(''))})}
  if(L.some(l=>(l.defects||[]).length))rows+=r('불량 유형','<td></td>'+L.map(l=>`<td class="df">${(l.defects||[]).map(esc).join(', ')||'·'}</td>`).join(''),'sep');
  if(LS.showMemo&&L.some(l=>l.memo))rows+=r('메모','<td></td>'+L.map(l=>`<td class="mm"><div title="${esc(l.memo||'')}">${esc(l.memo||'')}</div></td>`).join(''));
  return `<div class="ls-tw"><table class="ls-tb">${head}${rows}</table></div>`}

/* 1장에 들어가는지 확인 (A4 가로 비율) */
const LS_PW=1070,LS_PH=736;/* A4 가로 - 여백 7mm 의 인쇄 영역 (px, 96dpi) */
/* 높이가 넘치면 표를 가로로 넓혀(행 높이↓) 다시 재고, 전체를 같은 비율로 줄여 1장에 맞춤 */
function lsCalc(){const s=$('lsheet');if(!s)return {k:1,W:LS_PW};const old=s.style.width;let W=LS_PW,k=1;
  for(let i=0;i<5;i++){s.style.width=(W+60)+'px';const h=s.scrollHeight-52;k=Math.min(1,LS_PH/h);const nW=Math.round(LS_PW/k);if(Math.abs(nW-W)<4)break;W=nW}
  s.style.width=old;return {k,W}}
function lsFit(){const m=$('lsfit');if(!m||!$('lsheet'))return;const {k}=lsCalc(),pct=Math.round(k*100);
  m.innerHTML=pct>=99?'<span style="color:var(--ok)">● A4 가로 1장에 그대로 들어갑니다</span>':pct>=65?`<span style="color:var(--warn)">● 인쇄 시 ${pct}% 크기로 줄여 1장에 맞춥니다</span>`:`<span style="color:var(--ng)">● ${pct}% 까지 줄여야 1장에 들어갑니다. 글씨가 작아지니 LOT·사진 수를 줄이거나 메모를 빼 보세요</span>`}
function lsPrint(){const s=$('lsheet');if(!s)return;const {k,W}=lsCalc();s.style.setProperty('--ps',(k*0.95).toFixed(3));s.style.setProperty('--pw',W+'px');
  const t=document.title;document.title=(LS.title||lsDefTitle()).replace(/[\\/:*?"<>|]/g,'_')+'_'+TD();window.print();setTimeout(()=>document.title=t,500)}

function pinDueTxt(t){const [h,m]=t.split(':').map(Number),now=new Date(),dl=new Date();dl.setHours(h,m,0,0);const diff=Math.round((dl-now)/60000);
  if(diff<0)return `⏰ 오늘 ${t} 마감 지남`;const hh=Math.floor(diff/60),mm=diff%60;return `⏰ ${t}까지 ${hh?hh+'시간 ':''}${mm}분`}
function pinTick(){document.querySelectorAll('.pdl[data-t]').forEach(e=>{const wd=new Date().getDay();if(wd===0||wd===6)return;const t=e.dataset.t,txt=pinDueTxt(t);e.textContent=txt;e.classList.toggle('over',txt.includes('지남'));
  const [h,m]=t.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);const left=(d-new Date())/60000;e.classList.toggle('soon',left>=0&&left<=60)})}
setInterval(pinTick,30000);
function pinBoard(){const L=pinsSorted();return `<div class="pinb"><div class="pinh"><span class="pint">${ic('pin')} 놓치면 안 되는 것</span><span class="pinsub">누르면 수정</span></div>
<div class="pgrid">${L.map((n,i)=>{const it=pinItems(n.d),col=(PIN_C.find(c=>c[0]===n.c)||PIN_C[0])[1];
  return `<div class="pnote" style="--pc:${col};--rot:${[-1.6,1.2,-0.8,1.7,-1.2,0.9][i%6]}deg" onclick="openPin('${esc(n.id)}')"><span class="ppin"></span>
<div class="pnt">${esc(n.t)}</div>${it.length>1?`<div class="pntags">${it.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:`<div class="pnd">→ ${esc(n.d||'')}</div>`}${pinDue(n)}</div>`}).join('')}
<div class="pnote padd" onclick="openPin()"><span>${ic('plus')}</span>메모 추가</div></div></div>`}
function openPin(id){const ex=id?(S.pins||[]).find(n=>n.id===id):null;PF=ex?{...ex}:{id:'n'+Date.now().toString(36),t:'',d:'',c:PIN_C[(S.pins||[]).length%PIN_C.length][0],time:'',o:Math.max(0,...(S.pins||[]).map(n=>n.o||0))+1,_new:1};
  const o=document.createElement('div');o.className='sheetbg';o.id='pinbg';o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);pinSheet()}
function pinSheet(){const f=PF,o=$('pinbg');if(!o)return;const col=(PIN_C.find(c=>c[0]===f.c)||PIN_C[0])[1];
  o.innerHTML=`<div class="sheet"><div class="shh" style="display:flex;justify-content:space-between;align-items:center">${f._new?'메모 추가':'메모 수정'}<button class="ib" onclick="$('pinbg').remove()" aria-label="닫기">${ic('x')}</button></div>
<div class="pnote pprev" style="--pc:${col};--rot:0deg"><span class="ppin"></span><input id="pt" value="${esc(f.t)}" placeholder="언제 · 무엇을 (예: DHL Booking)" maxlength="40" oninput="PF.t=this.value"><textarea id="pd" rows="2" placeholder="할 일 · 주의할 것 (쉼표로 나누면 체크 항목으로 표시)" maxlength="200" oninput="PF.d=this.value">${esc(f.d)}</textarea></div>
<div class="fl">색상</div><div class="chips">${PIN_C.map(([k,c])=>`<span class="pcol${f.c===k?' on':''}" style="background:${c}" onclick="PF.c='${k}';pinSheet()" aria-label="색상"></span>`).join('')}</div>
<div class="fl">마감 시각 <span class="muted" style="font-weight:400;font-size:11px">(선택) 평일에 남은 시간 표시</span></div>
<div style="display:flex;gap:6px;align-items:center"><input id="ptm" type="time" value="${f.time||''}" style="width:150px" onchange="PF.time=this.value">${f.time?`<button onclick="PF.time='';pinSheet()">지우기</button>`:''}</div>
${!f._new?`<div class="fl">순서</div><div style="display:flex;gap:6px"><button onclick="pinMove(-1)">${ic('l')} 앞으로</button><button onclick="pinMove(1)">뒤로 ${ic('r')}</button></div>`:''}
<div id="pe" class="err" style="margin-top:8px"></div>
<button class="btnp" style="margin-top:12px" onclick="pinSave()">저장</button>
${!f._new?`<button id="pdel" class="w100" style="margin-top:8px;color:var(--ng)" onclick="pinDel()">삭제</button>`:''}</div>`}
function pinSave(){const f=PF;f.t=($('pt').value||'').trim();f.d=($('pd').value||'').trim();f.time=$('ptm').value||'';if(!f.t){$('pe').textContent='제목을 입력하세요';return}
  const {_new,...rec}=f;if(!rec.time)delete rec.time;S.pins=(S.pins||[]).filter(n=>n.id!==rec.id);S.pins.push(rec);dirtyM();$('pinbg').remove();PF=null;render();saveNow('메모 저장됨')}
function pinDel(){const b=$('pdel');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='한 번 더 누르면 삭제';return}S.pins=(S.pins||[]).filter(n=>n.id!==PF.id);dirtyM();$('pinbg').remove();PF=null;render()}
function pinMove(d){PF.t=$('pt').value;PF.d=$('pd').value;PF.time=$('ptm').value;const L=pinsSorted(),i=L.findIndex(n=>n.id===PF.id),j=i+d;if(i<0||j<0||j>=L.length)return;
  const a=L[i],b=L[j],t=a.o;a.o=b.o;b.o=t;if(a.o===b.o){L.forEach((n,k)=>n.o=k+1);[a.o,b.o]=[b.o,a.o]}PF.o=a.o;dirtyM();render();pinSheet()}

/* ---------- render ---------- */
function render(){nav();const b=$('body');let h='',f=false,pg=true;
  if(view==='home'){h=homeView();f=true;pg=false}
  else if(view==='log'){h=logView()}
  else if(view==='write'){h=writeView()}
  else if(view==='lotw'){h=LF?lotWriteView():(view=backTo,homeView())}
  else if(view==='moldw'){h=MF?moldWriteView():(view=backTo,homeView())}
  else if(view==='mold'){h=moldView()}
  else if(view==='lsum'){if(LS){h=lsView();pg=false}else{view='home';h=homeView();pg=false}}
  else if(view==='proj'){h=projView();f=true;pg=false}
  else if(view==='pd'){h=pdView();f=!pf}
  else if(view==='newp'){h=hdr('새 프로젝트',"go('proj')")+pForm()}
  else if(view==='appr'){h=apprView()}
  else if(view==='cal'){h=calView()}
  else if(view==='mbo'){h=mboView();pg=false}
  else if(view==='set'){h=setView()}
  b.innerHTML=pg?`<div class="page">${h}</div>`:h;fab(f);pinTick();hydratePhotos().then(()=>{if(view==='lsum')lsFit()});if(view==='lsum')lsFit()}
window.addEventListener('pagehide',()=>{if(dirty.size)flush()});
init();
</script>
</body>
</html>
